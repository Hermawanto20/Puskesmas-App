<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen User - UPTD Puskesmas Sukmajaya</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- POPUP SUKSES -->
<div id="popup-sukses" class="popup-overlay" style="display:none;">
  <div class="popup-box">
    <div class="popup-icon">✅</div>
    <h3 class="popup-title">Berhasil!</h3>
    <p class="popup-msg" id="popup-msg">Berhasil!</p>
    <button id="btn-popup-ok" onclick="tutupPopup()" class="btn-primary"
      style="width: auto; padding: 10px 32px;">OK</button>
  </div>
</div>

<!-- POPUP HAPUS -->
<div id="popup-hapus" class="popup-overlay" style="display:none;">
  <div class="popup-box">
    <div class="popup-icon">🗑️</div>
    <h3 class="popup-title" style="color:#dc2626;">Hapus User?</h3>
    <p class="popup-msg" id="popup-hapus-msg">Yakin ingin menghapus user ini?</p>
    <div style="display:flex; gap:12px; justify-content:center;">
      <button id="btn-hapus-ok" class="btn-primary"
        style="width:auto; padding:10px 28px; background:#dc2626;">
        🗑️ Hapus
      </button>
      <button onclick="tutupPopupHapus()" class="btn-secondary"
        style="padding:10px 28px;">
        Batal
      </button>
    </div>
  </div>
</div>

<nav class="navbar">
  <div class="nav-brand">
    <img src="images/logo.png" alt="Logo">
    UPTD Puskesmas Sukmajaya
  </div>
  <div class="nav-menu">
    <a href="dashboard.html">Dashboard</a>
    <a href="surat-sehat.html">Surat Sehat</a>
    <a href="surat-sakit.html">Surat Sakit</a>
    <a href="kwitansi.html">Kwitansi</a>
    <a href="laporan.html">Laporan</a>
    <a href="users.html" id="menu-user">👥 Users</a>
    <span id="nama-user" class="nama-user"></span>
    <button onclick="logout()" class="btn-logout">Logout</button>
  </div>
</nav>

<div class="container">
  <h1>👥 Manajemen User</h1>
  <p class="subtitle">Kelola akun admin dan petugas</p>

  <!-- FORM TAMBAH USER -->
  <div class="form-card" style="margin-bottom: 24px;">
    <h2 style="margin-bottom: 16px;">➕ Tambah User Baru</h2>

    <div class="form-row">
      <div class="form-group">
        <label>Nama Lengkap *</label>
        <input type="text" id="nama" placeholder="Nama lengkap">
      </div>
      <div class="form-group">
        <label>Username *</label>
        <input type="text" id="username-baru" placeholder="Username untuk login">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="password-baru" placeholder="Password">
      </div>
      <div class="form-group">
        <label>Role *</label>
        <select id="role">
          <option value="petugas">Petugas</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>

    <div class="form-row">
  <div class="form-group">
    <label>Nama Dokter (opsional)</label>
    <input type="text" id="nama-dokter-user" 
      placeholder="Kosongkan jika bukan dokter">
  </div>
  </div>

    <div class="btn-group">
      <button id="btn-simpan" onclick="simpanUser()" class="btn-primary"
        style="width: auto; padding: 10px 24px;">
        💾 Simpan User
      </button>
      <button onclick="resetFormUser()" class="btn-secondary"
        style="padding: 10px 24px;">
        🔄 Reset
      </button>
    </div>
  </div>

  <!-- TABEL USER -->
  <div class="table-box">
    <h2>Daftar User</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Username</th>
            <th>Role</th>
            <th>Dibuat</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabel-users"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/nomor.js"></script>
<script src="js/users.js"></script>
</body>
</html>
